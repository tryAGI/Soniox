site_name: Soniox .NET Documentation
site_description: Documentation for the tryAGI .NET SDK for Soniox.
site_url: https://tryAGI.github.io/Soniox/
repo_url: https://github.com/tryAGI/Soniox
repo_name: tryAGI/Soniox
edit_uri: edit/main/docs/
nav:
- Overview: index.md
- Guides:
  - Microsoft.Extensions.AI: guides/meai.md
  - Voice Cloning and Realtime TTS: guides/voice-cloning.md
# EXAMPLES:START
- Examples:
  - MeaiSpeechToTextParsing: examples/meaispeechtotextparsing.md
  - Construct a SonioxClient: examples/generate.md
  - List models: examples/list-models.md
  - Transcribe from URL (async): examples/transcribe-from-url.md
  - Voice cloning with Text-to-Speech: examples/voice-cloning.md
  - Realtime Text-to-Speech: examples/realtime-text-to-speech.md
  - MEAI ISpeechToTextClient: examples/meai-speech-to-text.md
  - MEAI AIFunction tools: examples/meai-tools.md
# EXAMPLES:END
        
theme:
  name: tryagi
  favicon: 'media/icon128.png'

plugins:
  - search
  - copy-to-llm

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: ""
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.progressbar
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
